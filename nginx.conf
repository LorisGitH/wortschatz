# Serves the static app. Copied over the base image's conf.d/default.conf by the Dockerfile.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # An add_header is inherited only if the current level has none, so each location sets its own:
    # https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header

    # The entry points are revalidated, so that an installed copy picks up a new version.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    # nginx's mime.types has no .webmanifest entry (read 2026-10-30 at
    # https://github.com/nginx/nginx/blob/release-1.31.6/conf/mime.types), so the type is set
    # here. An empty `types` plus `default_type` makes a location answer with one type (the
    # pattern in https://nginx.org/en/docs/http/ngx_http_core_module.html#types).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The icon names carry no hash, so 30 days rather than a year.
    location ~ ^/icon-[a-z0-9-]+\.png$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        return 404;
    }
}
