# Serves the static app. Loaded in place of the base image's conf.d/default.conf.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # add_header in a location replaces the ones above it, so each location sets its own.

    # The entry points are revalidated, so that an installed copy picks up a new version.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    # nginx's default mime.types may not map .webmanifest to this type; set it here.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The icon names carry no hash, so 30 days rather than a year.
    location ~ ^/icon-[a-z0-9-]+\.png$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        return 404;
    }
}
