# Serves the static app. Copied over the base image's conf.d/default.conf by the Dockerfile.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # An add_header is inherited only if the current level has none, so each location sets its own:
    # https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header

    # Content-Security-Policy of the page (issue #2). The proxy in front adds the other security
    # headers; this one depends on what the app loads, so it lives here. What it allows, and why:
    # - script-src 'self': the only script is app.js (build_pwa.py moves it out of the page).
    # - style-src 'unsafe-inline': the page has a <style> block and style="…" attributes;
    #   fonts.googleapis.com serves the stylesheet of the two web fonts.
    # - font-src fonts.gstatic.com: the font files themselves.
    # - img-src data: blob:: class photos are kept in the app as data: URLs and shown as blob: URLs.
    # - connect-src data:: the app turns those data: URLs into files with fetch().
    # - worker-src / manifest-src 'self': sw.js and manifest.webmanifest.
    # Directive reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

    # The entry points are revalidated, so that an installed copy picks up a new version.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp;
    }
    # The page asks for app.js?v=<build>, so a new page never runs an old script.
    location = /app.js {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    # nginx's mime.types has no .webmanifest entry (read 2026-10-30 at
    # https://github.com/nginx/nginx/blob/release-1.31.6/conf/mime.types), so the type is set
    # here. An empty `types` plus `default_type` makes a location answer with one type (the
    # pattern in https://nginx.org/en/docs/http/ngx_http_core_module.html#types).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The icon names carry no hash, so 30 days rather than a year.
    location ~ ^/icon-[a-z0-9-]+\.png$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        return 404;
    }
}
