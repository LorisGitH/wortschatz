# Checks that the published files (index.html, app.js, sw.js, manifest, README) are exactly
# what src/ builds to: a change made to src/ without running ./build.sh, or a change made by
# hand to a built file, fails here.
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build from src/
        run: ./build.sh

      - name: Built files match the sources
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::Les fichiers construits ne correspondent pas à src/. Lancer ./build.sh et committer le résultat."; git diff --stat; exit 1; }
