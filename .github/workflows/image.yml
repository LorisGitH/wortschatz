# Builds the app's container image on every push to main, checks it, and publishes it to
# GHCR as ghcr.io/lorisgith/wortschatz:main-<unix timestamp>-<short sha>. The Traquenard
# Server's bump workflow orders tags by that timestamp. GitHub Pages is published by its
# own, separate mechanism and is not touched.
#
# A first push creates the package private (https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry),
# so after the first run, set it to public by hand in the package's settings on GitHub; without that
# the Cluster can't pull it.
name: image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    # A native arm64 runner, free and unlimited on public repositories (no QEMU):
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build
        run: |
          ts=$(git show -s --format=%ct HEAD)
          echo "tag=main-${ts}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          docker build --platform linux/arm64 -t wortschatz:test .

      - name: Runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id wortschatz:test -u)
          [ "$uid" != 0 ] || { echo "the container runs as root" >&2; exit 1; }

      - name: Smoke check
        run: |
          docker run -d --name app -p 8080:8080 wortschatz:test
          for _ in $(seq 20); do curl -fs -o /dev/null http://localhost:8080/ && ready=1 && break; sleep 1; done
          [ -n "${ready:-}" ] || { docker logs app; echo "the container never answered" >&2; exit 1; }
          ./smoke.sh http://localhost:8080 || { docker logs app; exit 1; }

      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/lorisgith/wortschatz:${tag}
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag wortschatz:test "$image"
          docker push "$image"
