<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wortschatz">
<meta name="theme-color" content="#F1F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="description" content="Allemand du quotidien : vocabulaire, grammaire, verbes et phrases, A1 à B2.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Wortschatz Alltag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one narrow column like a transit timetable card; signal-yellow accent from German stop signs; der/die/das colour-coded throughout. */
:root {
  --bg: #F1F3EF;
  --surface: #FFFFFF;
  --ink: #16201C;
  --muted: #5A6660;
  --line: #D8DDD7;
  --signal: #F2C230;
  --signal-ink: #1A1A12;
  --good: #1F7A4A;
  --good-bg: #E3F2E8;
  --bad: #B3263A;
  --bad-bg: #F8E3E6;
  --der: #2457A6;
  --die: #C0364A;
  --das: #2C8550;
  --pl: #7A5BB0;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --irr: #B4560F;
  --tr: #7A5230;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412; --surface: #18201D; --ink: #E6ECE8; --muted: #9AA69F; --line: #2B3531;
    --signal: #F2C230; --signal-ink: #1A1A12;
    --good: #5CC98A; --good-bg: #183326; --bad: #F07A8B; --bad-bg: #3A1C22;
    --der: #79A6EE; --die: #F07A8B; --das: #63C98F; --pl: #B39AE6; --irr: #F2A35E; --tr: #E0B68A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #18201D; --ink: #E6ECE8; --muted: #9AA69F; --line: #2B3531;
  --signal: #F2C230; --signal-ink: #1A1A12;
  --good: #5CC98A; --good-bg: #183326; --bad: #F07A8B; --bad-bg: #3A1C22;
  --der: #79A6EE; --die: #F07A8B; --das: #63C98F; --pl: #B39AE6; --irr: #F2A35E; --tr: #E0B68A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
/* no page zoom on phones: no double-tap zoom, and fields big enough that iOS doesn't zoom in on focus */
html { touch-action: manipulation; }
@media (pointer: coarse) { input, textarea, select { font-size: max(16px, 1em) !important; } }
.wrap { max-width: 580px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 300px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.label { font-family: var(--font-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbtns { display: flex; align-items: center; gap: 8px; flex: none; }
#reloadbtn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hsign { width: 34px; height: 34px; border-radius: 50%; background: var(--signal); color: var(--signal-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; border: 3px solid var(--good); flex: none; }
.brand h1 { font-size: 26px; font-weight: 700; line-height: 1; }
.brand small { display: block; font-size: 13px; color: var(--muted); font-family: var(--font-body); font-weight: 400; letter-spacing: 0; margin-top: 2px; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--good); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.stat { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.goal { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.goal .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.goal .bar i { display: block; height: 100%; background: var(--signal); border-radius: 3px; transition: width .4s; }

/* daily review CTA */
.cta { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; background: var(--signal); color: var(--signal-ink); border: 0; border-radius: var(--r); padding: 18px 18px; }
.cta h2 { font-size: 24px; font-weight: 700; }
.cta p { margin: 2px 0 0; font-size: 14px; }
.cta .go { margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.cta:hover { filter: brightness(1.04); }

/* modes */
.section { display: flex; flex-direction: column; gap: 10px; }
.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 5px; }
.modes.two { grid-template-columns: repeat(2, 1fr); }
.mode { border: 0; background: transparent; border-radius: 7px; padding: 9px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.mode b { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.mode span { font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.2; }
.mode[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mode[aria-pressed="true"] span { color: inherit; opacity: .8; }
.dirs { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

/* themes */
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.theme { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 11px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.theme:hover:not(:disabled) { border-color: var(--ink); }
.theme:disabled { opacity: .45; cursor: not-allowed; }
.theme h3 { font-size: 18px; font-weight: 600; line-height: 1.1; }
.theme p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.theme .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: auto; }
.meter { flex: 1; display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--line); }
.meter i { display: block; height: 100%; }
.meter .m2 { background: var(--good); }
.meter .m1 { background: var(--signal); }
.theme.all { grid-column: 1 / -1; flex-direction: row; align-items: center; }
.theme.all .meta { margin: 0 0 0 auto; min-width: 120px; }

/* lexicon */
.search { width: 100%; padding: 11px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); font: inherit; color: var(--ink); }
.lex { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.lex .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 9px 12px; align-items: center; }
.lex .row + .row { border-top: 1px solid var(--line); }
.lex .de { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.lex .fr { color: var(--muted); font-size: 14px; grid-column: 1; min-width: 0; }
.lex .lexf { grid-column: 1; font-size: 13px; color: var(--muted); padding-left: 14px; }
.lex .side { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 8px; }
.lex .lex-ex { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 10px; margin-top: 4px; padding: 7px 10px; border-left: 3px solid var(--signal); background: var(--bg); border-radius: 0 6px 6px 0; }
.lex .lex-ex > div { flex: 1; min-width: 0; }
.lex .lex-ex .ex-de { font-size: 15px; }
.lex .lex-ex .ex-fr { font-size: 13px; }
.lex .more { font-size: 13px; color: var(--muted); padding: 10px 12px; border-top: 1px solid var(--line); }
.boxes { display: flex; gap: 2px; }
.boxes i { width: 5px; height: 12px; border-radius: 1px; background: var(--line); }
.boxes i.on { background: var(--good); }

/* article colouring */
.art { font-weight: 700; }
.art-der { color: var(--der); }
.art-die { color: var(--die); }
.art-das { color: var(--das); }
.show-g .dknoun { font-weight: 700; }
.show-g .dknoun.g-m { color: var(--der); } .show-g .dknoun.g-f { color: var(--die); } .show-g .dknoun.g-n { color: var(--das); }
.gline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.gline .hint { margin: 0; }
.gtag { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1.5px solid currentColor; font-size: 13px; font-weight: 700; }
.gtag.g-m { color: var(--der); } .gtag.g-f { color: var(--die); } .gtag.g-n { color: var(--das); }
.gchip { margin-top: 12px; }
.art-pl { color: var(--pl); }
.tag { font-size: 11px; font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; vertical-align: 2px; margin-left: 4px; }

.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 50%; width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; flex: none; line-height: 0; }
.icon-btn svg { display: block; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.sm { width: 30px; height: 30px; }
.icon-btn.sm svg { width: 15px; height: 15px; }

/* quiz */
.qtop { display: flex; align-items: center; gap: 12px; }
.qtop .x { border: 0; background: none; font-size: 15px; color: var(--muted); padding: 6px 0; }
.steps { flex: 1; display: flex; gap: 3px; }
.steps i { flex: 1; height: 6px; border-radius: 2px; background: var(--line); }
.steps i.ok { background: var(--good); }
.steps i.ko { background: var(--bad); }
.steps i.cur { background: var(--ink); }
.qcount { font-size: 14px; color: var(--muted); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 18px 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.qkind { display: flex; align-items: center; gap: 8px; width: 100%; }
.qkind .theme-name { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.prompt { font-family: var(--font-display); font-size: clamp(28px, 8vw, 40px); font-weight: 600; line-height: 1.12; overflow-wrap: anywhere; }
.prompt.fr { font-family: var(--font-body); font-weight: 700; font-size: clamp(22px, 6vw, 30px); }
.hint { font-size: 14px; color: var(--muted); }
.choices { display: grid; grid-template-columns: 1fr; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 13px 14px; font-size: 17px; min-height: 54px; }
.choice kbd { font-family: var(--font-display); font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; flex: none; }
.choice:hover:not(:disabled) { border-color: var(--ink); }
.choice.right { border-color: var(--good); background: var(--good-bg); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice:disabled { cursor: default; }
.articles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.articles .choice { justify-content: center; font-family: var(--font-display); font-size: 26px; font-weight: 700; min-height: 72px; }
.articles .a-der { color: var(--der); } .articles .a-die { color: var(--die); } .articles .a-das { color: var(--das); }
.typebox { display: flex; flex-direction: column; gap: 8px; }
.typebox input { width: 100%; font: inherit; font-size: 20px; padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.typebox input.right { border-color: var(--good); background: var(--good-bg); }
.typebox input.wrong { border-color: var(--bad); background: var(--bad-bg); }
.umlauts { display: flex; gap: 6px; flex-wrap: wrap; }
.umlauts button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; min-width: 44px; padding: 7px 0; font-size: 17px; }
.primary { border: 0; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 14px 18px; font-family: var(--font-display); font-size: 19px; font-weight: 600; width: 100%; }
.primary:disabled { opacity: .4; cursor: default; }
.secondary { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 13px 18px; font-family: var(--font-display); font-size: 18px; font-weight: 600; width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card-back { width: 100%; border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.card-back .fr { font-size: 22px; font-weight: 700; }

/* feedback sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); z-index: 5; animation: up .18s ease-out; }
.sheet.good { background: var(--good-bg); border-color: var(--good); }
.sheet.bad { background: var(--bad-bg); border-color: var(--bad); }
.sheet-in { max-width: 580px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.verdict { display: flex; align-items: center; gap: 10px; }
.verdict h3 { font-size: 22px; font-weight: 700; }
.sheet.good .verdict h3 { color: var(--good); }
.sheet.bad .verdict h3 { color: var(--bad); }
.answer { display: flex; align-items: flex-start; gap: 10px; }
.answer > div { min-width: 0; flex: 1; }
.answer .de { font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
.answer .sub { font-size: 14px; color: var(--muted); }
/* translations: own line, shifted right, italic, warm tone, so they never mix with the German */
.trl, .ex-fr, .missed .fr, .lex .fr, .errrow .fr { font-style: italic; color: var(--tr) !important; padding-left: 12px; border-left: 2px solid color-mix(in srgb, var(--tr) 35%, transparent); margin-top: 2px; }
.trl { font-size: 16px; }
.plx { color: var(--muted); font-size: 14px; font-weight: 400; }
.ex { display: flex; align-items: flex-start; gap: 10px; width: 100%; border-top: 1px solid var(--line); padding-top: 9px; }
.ex-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ex-de { font-size: 16.5px; overflow-wrap: anywhere; }
.ex-fr { font-size: 13.5px; color: var(--muted); }
@keyframes up { from { transform: translateY(30%); opacity: 0; } to { transform: none; opacity: 1; } }

/* results */
.score { display: flex; align-items: baseline; gap: 10px; }
.score b { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); }
.missed { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.missed .row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; }
.missed .row + .row { border-top: 1px solid var(--line); }
.missed .row div { flex: 1; min-width: 0; }
.missed .fr { font-size: 14px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; column-gap: 14px; row-gap: 0; border-bottom: 1px solid var(--line); }
.tabs-sep { flex-basis: 100%; height: 0; }
.tab { border: 0; background: none; padding: 8px 0 10px; font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--signal); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend b { font-family: var(--font-display); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.switch-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 14px; }
.switch-row span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.switch-row small { font-size: 12.5px; color: var(--muted); }
.switch { flex: none; width: 50px; height: 30px; border-radius: 15px; border: 0; background: var(--line); position: relative; padding: 0; transition: background .2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"] i { transform: translateX(20px); }
.fiche-link { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; font-size: 15px; }
.fiche-link > span:nth-child(2) { flex: 1; min-width: 0; }
.fiche-link:hover { border-color: var(--ink); }
.fiche-links { display: flex; flex-direction: column; gap: 6px; }
.sheet .fiche-link { background: var(--surface); padding: 8px 10px; font-size: 14px; }
.fnum { flex: none; display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 6px; background: var(--ink); color: var(--bg); font-family: var(--font-display); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.fnum.sm { min-width: 22px; height: 22px; font-size: 13px; margin-right: 8px; vertical-align: 1px; }
.flist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.frow { display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: none; padding: 10px 12px; width: 100%; }
.frow + .frow { border-top: 1px solid var(--line); }
.frow:hover .ftitle { text-decoration: underline; }
.ftitle { flex: 1; min-width: 0; font-weight: 700; display: flex; flex-direction: column; }
.ftitle small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.pill { flex: none; font-size: 12px; border-radius: 999px; padding: 3px 9px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill-ok { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.pill-weak, .pill-old { background: var(--surface); border-color: var(--signal); color: var(--ink); }
.ov { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ov-in { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; display: flex; flex-direction: column; gap: 16px; }
.ov-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; background: var(--bg); padding-block: 6px; z-index: 1; border-bottom: 1px solid var(--line); }
.ov-top .x { border: 0; background: none; font-size: 15px; color: var(--muted); padding: 6px 0; }
.ftitle-big { font-size: clamp(28px, 7vw, 38px); font-weight: 700; line-height: 1.05; }
.fiche { display: flex; flex-direction: column; gap: 12px; line-height: 1.55; }
.fiche p { margin: 0; max-width: 65ch; }
.fiche ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.fh { font-size: 19px; font-weight: 600; margin-top: 8px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { padding: 7px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.tbl thead th { font-family: var(--font-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--bg); white-space: nowrap; }
